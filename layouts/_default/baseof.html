<!doctype html>
<html lang="{{ .Site.Language.Lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ if .IsHome }}{{ .Site.Title }} · {{ .Site.Params.tagline }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ if .IsPage }}{{ .Summary | plainify | truncate 160 }}{{ else }}{{ .Site.Params.description }}{{ end }}{{ end }}">
<meta name="author" content="Brian Teunissen">
<link rel="canonical" href="{{ .Permalink }}">
{{ range .AllTranslations }}<link rel="alternate" hreflang="{{ .Language.Lang }}" href="{{ .Permalink }}">
{{ end }}{{ with .OutputFormats.Get "rss" }}<link rel="alternate" type="application/rss+xml" title="{{ $.Site.Title }}" href="{{ .Permalink }}">{{ end }}
<meta property="og:title" content="{{ .Title }}">
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:image" content="{{ with .Params.featured_image }}{{ . | absURL }}{{ else }}{{ "images/photos/hero-brian.jpg" | absURL }}{{ end }}">
<meta property="og:locale" content="{{ replace .Site.Language.LanguageCode "-" "_" }}">
<link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">
{{ $css := resources.Get "css/main.css" | minify | fingerprint }}<link rel="stylesheet" href="{{ $css.RelPermalink }}">
</head>
<body>
{{ partial "header.html" . }}
<main id="main">{{ block "main" . }}{{ end }}</main>
{{ partial "footer.html" . }}
<script>document.addEventListener('click',function(e){var b=e.target.closest('[data-copy]');if(!b)return;var u=b.getAttribute('data-copy'),o=b.getAttribute('data-orig')||b.innerHTML;b.setAttribute('data-orig',o);
function done(){b.textContent=b.getAttribute('data-done');b.classList.add('ok');clearTimeout(b._t);b._t=setTimeout(function(){b.innerHTML=o;b.classList.remove('ok')},2000)}
var mobile=matchMedia('(max-width:860px),(pointer:coarse)').matches;
if(mobile&&navigator.share){navigator.share({title:b.getAttribute('data-title')||document.title,url:u}).catch(function(){});return}
if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(u).then(done,function(){prompt('',u)})}else{var t=document.createElement('textarea');t.value=u;document.body.appendChild(t);t.select();try{document.execCommand('copy');done()}catch(x){prompt('',u)}t.remove()}});
document.addEventListener('click',function(e){var t=e.target.closest('.menu-toggle');if(t){document.body.classList.toggle('nav-open')}});</script>
</body>
</html>
